<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Planificador de Estudios</title>
  <link rel="stylesheet" href="styles.css">
  <script src="tema.js"></script>
</head>
<body>

<header class="top">
  <div class="brand">📚 Planificador</div>
  <nav id="nav">
    <button data-act="view" data-view="today">Hoy</button>
    <button data-act="view" data-view="month">Mes</button>
    <button data-act="view" data-view="week">Semana</button>
    <button data-act="view" data-view="subjects">Asignaturas</button>
  </nav>
  <button id="permBtn" class="ghost" data-act="perm">🔔 Activar avisos</button>
</header>

<div id="upNext" class="upnext hidden"></div>
<main id="app"></main>
<div id="toasts"></div>

<!-- ===== Diálogo: actividad ===== -->
<dialog id="eventDlg">
  <form id="eventForm">
    <h2 id="evHeading">Nueva actividad</h2>
    <input type="hidden" id="ev-id">
    <input type="hidden" id="ev-occ">
    <fieldset id="ev-apply-wrap" style="display:none">
      <legend>Esta actividad se repite. Aplicar los cambios a:</legend>
      <label class="chk"><input type="radio" name="apply" value="all" checked> Toda la serie</label>
      <label class="chk"><input type="radio" name="apply" value="one"> Solo el día <b id="ev-occ-label"></b></label>
    </fieldset>
    <label>Título
      <input id="ev-title" required maxlength="80" placeholder="Ej. Cumpleaños de Laura">
    </label>
    <div class="row">
      <label>Fecha <input type="date" id="ev-date" required></label>
      <label>Hora de inicio <input type="time" id="ev-start" required></label>
      <label>Duración (min) <input type="number" id="ev-dur" min="5" step="5" value="60" required></label>
    </div>
    <p class="hint" id="ev-end"></p>
    <div class="row">
      <label>Tipo
        <select id="ev-cat"></select>
      </label>
      <label>Asignatura
        <select id="ev-subj"></select>
      </label>
      <label>Repetir
        <select id="ev-repeat">
          <option value="none">No se repite</option>
          <option value="weekly">Cada semana</option>
        </select>
      </label>
    </div>
    <label>Dónde se muestra
      <select id="ev-scope">
        <option value="all">En el calendario del mes y de la semana</option>
        <option value="week">Solo en la semana (organizar el día)</option>
      </select>
    </label>
    <label id="ev-until-wrap" style="display:none">Repetir hasta (incluido; vacío = sin fecha final)
      <input type="date" id="ev-until">
    </label>
    <fieldset>
      <legend>Avisarme</legend>
      <label class="chk"><input type="checkbox" name="rem" value="daybefore"> La tarde anterior (20:00)</label>
      <label class="chk"><input type="checkbox" name="rem" value="morning"> Por la mañana del día (8:00)</label>
      <label class="chk"><input type="checkbox" name="rem" value="180"> 3 horas antes</label>
      <label class="chk"><input type="checkbox" name="rem" value="60"> 1 hora antes</label>
      <label class="chk"><input type="checkbox" name="rem" value="30"> 30 minutos antes</label>
      <label class="chk"><input type="checkbox" name="rem" value="15"> 15 minutos antes</label>
      <label class="chk"><input type="checkbox" name="rem" value="start"> Cuando empiece</label>
    </fieldset>
    <label>Notas
      <textarea id="ev-notes" rows="2" placeholder="Opcional"></textarea>
    </label>
    <div class="actions">
      <button type="button" class="danger" id="ev-del">Eliminar</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<!-- ===== Diálogo: asignatura ===== -->
<dialog id="subjDlg">
  <form id="subjForm">
    <h2 id="sjHeading">Nueva asignatura</h2>
    <input type="hidden" id="sj-id">
    <label>Nombre <input id="sj-name" required maxlength="60" placeholder="Ej. Matemáticas"></label>
    <div class="row">
      <label>Color <input type="color" id="sj-color" value="#4f7cff"></label>
      <label>Nota para aprobar <input type="number" id="sj-target" min="0" max="10" step="0.1" value="5"></label>
    </div>
    <label class="chk"><input type="checkbox" id="sj-mh"> Matrícula de honor</label>
    <div class="actions">
      <button type="button" class="danger" id="sj-del">Eliminar</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<!-- ===== Diálogo: apunte / resumen ===== -->
<dialog id="noteDlg">
  <form id="noteForm">
    <h2 id="ntHeading">Nuevo apunte</h2>
    <input type="hidden" id="nt-id">
    <label>Título <input id="nt-title" required maxlength="100" placeholder="Ej. Tema 3 – Derivadas"></label>
    <label>Resumen / apuntes
      <textarea id="nt-text" rows="8" placeholder="Escribe aquí tu resumen..."></textarea>
    </label>
    <label>Adjuntar archivos (PDF, Word, imágenes...)
      <input type="file" id="nt-files" multiple>
    </label>
    <div id="nt-existing"></div>
    <div class="actions">
      <button type="button" class="danger" id="nt-del">Eliminar</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<!-- ===== Diálogo: nota / evaluación ===== -->
<dialog id="gradeDlg">
  <form id="gradeForm">
    <h2 id="grHeading">Nueva evaluación</h2>
    <input type="hidden" id="gr-id">
    <label>Nombre <input id="gr-name" required maxlength="60" placeholder="Ej. Parcial 1"></label>
    <div class="row">
      <label>Nota (0-10) <input type="number" id="gr-grade" min="0" max="10" step="0.01" placeholder="Pendiente"></label>
      <label>Peso (%) <input type="number" id="gr-weight" min="0" max="100" step="1" value="20" required></label>
      <label>Fecha <input type="date" id="gr-date"></label>
    </div>
    <p class="hint">Deja la nota vacía si la evaluación aún no se ha hecho.</p>
    <div class="actions">
      <button type="button" class="danger" id="gr-del">Eliminar</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
<script src="asistente.js"></script>
<script src="copia.js"></script>
<script src="metas.js"></script>
<script src="estudio.js"></script>
<script src="extras.js"></script>
<script src="estudio2.js"></script>
<script src="planificador.js"></script>
<script src="repaso.js"></script>
<script src="asignatura.js"></script>
<script src="semanal.js"></script>
</body>
</html>
